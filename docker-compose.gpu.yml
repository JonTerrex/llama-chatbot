services:
  # Proveedor Llama 3 8B en GPU (4 bits). Con profile propio "llama" (ver abajo).
  llama-local:
    # La GPU es un recurso aparte: --profile dev no levanta este servicio; se pide con --profile llama.
    profiles: ["llama"]
    build:
      context: .
      dockerfile: Dockerfile.llama
    volumes:
      # El modelo se monta, no va en la imagen.
      - ./modelos:/app/modelos:ro
    environment:
      # Override manual opcional del tope de contexto (tokens). Vacío = automático: por
      # defecto el tope sale de la VRAM disponible al terminar la carga.
      CONTEXTO_MAX_TOKENS: ${CONTEXTO_MAX_TOKENS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # "no": si la carga falla (sin GPU, poca VRAM) el proveedor queda vivo en estado
    # "failed", con el motivo en el log, en vez de reiniciarse en bucle.
    restart: "no"
    ports:
      # Solo loopback: el proveedor no autentica. NUNCA publicarlo sin el 127.0.0.1;
      # en cloud no se publica, el orquestador lo alcanza por la red interna (http://llama-local:8000).
      - "127.0.0.1:8004:8000"
    healthcheck:
      # La imagen slim no trae curl. Sano solo con HTTP 200 ("ready"): loading y failed dan 503.
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Cargas medidas: de 194 a 375 s sobre bind mount de Windows. 600 s deja margen; los
      # fallos durante este período no cuentan.
      start_period: 600s