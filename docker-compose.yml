#eliminar la linea de version por estar depreciada
#version: "3.8"

services:
  # Frontend (Streamlit): habla con el orquestador
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    profiles: ["dev"]
    ports:
      - "8501:8501"
    environment:
      # DNS interno de Docker. El orquestador enruta al proveedor según providers.yaml
      - API_URL=http://orchestrator:8000/v1/chat/completions
      # Mayor que PROVIDER_TIMEOUT_S: así el 504 limpio del orquestador llega antes que el corte de la UI
      - DEFAULT_TIMEOUT=130 # Microservicio del Frontend (Streamlit)

# Proveedor simulado (solo desarrollo): expone x_debug y /debug/requests
  mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    profiles: ["dev"]
    ports:
      # Solo loopback: /debug/requests expone los últimos cuerpos recibidos, que con la
      # memoria activa incluyen el historial de la conversación.
      - "127.0.0.1:8001:8000"
    environment:
      - MOCK_LATENCY=0
      - MOCK_HISTORY_SIZE=20
# Orquestador (desarrollo): enruta /v1/chat/completions según providers.yaml
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    profiles: ["dev"]
    ports:
      # Solo loopback: con la memoria activa, quien alcance este puerto puede leer las
      # conversaciones del usuario de desarrollo (la memoria no autentica y el
      # orquestador fija el user_id).
      - "127.0.0.1:8002:8000"
    volumes:
      # Registro de proveedores montado, no horneado en la imagen
      - ./providers.yaml:/app/providers.yaml:ro
    environment:
      # Modelo cuando la petición no trae "model"; tiene que existir en providers.yaml
      - DEFAULT_MODEL=mock
      # Segundos máximos esperando la respuesta del proveedor
      - PROVIDER_TIMEOUT_S=120
      # Memoria por la red interna. Vacía = memoria deshabilitada (x_conversation_id da 503)
      - MEMORY_URL=http://memory:8000
      # Usuario fijo de desarrollo: el cliente nunca lo manda (contrato de memoria, 4.1)
      - DEV_USER_ID=dev-user
      # Mensajes de historial que se leen por pedido (máximo 200)
      # 8 y no 20: el contexto útil de llama-local es ~1900-2500 tokens y 20 mensajes lo desbordan
      - MEMORY_HISTORY_LIMIT=8
      # Debe ser MAYOR que POOL_TIMEOUT_S de la memoria (4 s): con 1 s de margen, la memoria
      # alcanza a contestar su 503 antes del corte (contrato de memoria, 3.5)
      - MEMORY_TIMEOUT_S=5
      # Nivel del logger "orchestrator" (DEBUG a CRITICAL); httpx2/httpcore2 quedan siempre en WARNING
      - LOG_LEVEL=INFO
    # En dev se levanta el stack completo en orden: el orquestador arranca con la memoria lista.
    depends_on:
      memory:
        condition: service_healthy

  # PostgreSQL de la memoria (desarrollo). Sin ports: solo accesible por la red interna de compose.
  postgres:
    image: postgres:18
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      # Desde la imagen 18 el VOLUME es /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker).
      - memory-db:/var/lib/postgresql
    healthcheck:
      # $$ para que compose no interpole: las variables las expande el shell del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicio de memoria: historial de conversaciones sobre PostgreSQL.
  memory:
    build:
      context: .
      dockerfile: Dockerfile.memory
    profiles: ["dev"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Solo loopback: el servicio NO autentica y confía en el user_id que recibe
      # (contrato de memoria, principio 7). Publicado en 0.0.0.0, cualquiera en la red
      # podría leer o escribir conversaciones ajenas. El orquestador lo alcanza por
      # la red interna (http://memory:8000), no por este puerto.
      - "127.0.0.1:8003:8000"
    healthcheck:
      # La imagen slim no trae curl. Sano SOLO si el cuerpo dice "ready": /health
      # responde 200 también en "loading", así que el status HTTP no alcanza.
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)).get('status') == 'ready' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
    memory-db:
