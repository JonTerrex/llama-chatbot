[project]
name = "llama-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JonTerrex", email = "juan.anuch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
llama-chatbot = "llama_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
